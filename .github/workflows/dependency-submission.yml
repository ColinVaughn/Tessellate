name: Dependency Submission

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  submit:
    name: Submit Gradle dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/dependency-submission@v6

name: Build JAR

# Builds the mod, runs the unit tests and the GameTest server, and attaches the NeoForge JAR
# to the run so it can be downloaded without building locally.
on:
  workflow_dispatch:
  push:
    branches: [load-balancing]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test
        run: bash ./gradlew build runGameTestServer --no-daemon --stacktrace
      - name: Upload NeoForge JAR
        uses: actions/upload-artifact@v7
        with:
          name: tessellate-neoforge
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-sources.jar
            !neoforge/build/libs/*-dev*.jar
          if-no-files-found: error
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-reports
          path: |
            **/build/reports/**
            run/gametest/logs/**
          if-no-files-found: ignore
          retention-days: 7

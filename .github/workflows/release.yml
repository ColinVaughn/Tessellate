name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify release version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          test "$tag_version" = "$mod_version" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match mod_version=$mod_version"
            exit 1
          }
      - name: Build and test
        run: bash ./gradlew build runGameTestServer --no-daemon --stacktrace
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t artifacts < <(find fabric/build/libs neoforge/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-dev-shadow.jar' ! -name '*-sources.jar')
          test "${#artifacts[@]}" -eq 2
          gh release create "$GITHUB_REF_NAME" "${artifacts[@]}" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

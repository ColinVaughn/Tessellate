plugins {
    id 'com.github.johnrengelman.shadow'
}

def modId = rootProject.mod_id

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        client {
            runDir '../run-client'
            programArgs '--username', 'Dev', '--quickPlayMultiplayer', '127.0.0.1:25565'
            property 'neoforge.enabledGameTestNamespaces', modId
        }
        client2 {
            client()
            runDir '../run-client-2'
            programArgs '--username', 'Dev2', '--quickPlayMultiplayer', '127.0.0.1:25565'
            property 'neoforge.enabledGameTestNamespaces', modId
        }
        server {
            runDir '../run'
            property 'neoforge.enabledGameTestNamespaces', modId
        }
        gameTestServer {
            server()
            runDir '../run/gametest'
            property 'neoforge.enableGameTest', 'true'
            property 'neoforge.gameTestServer', 'true'
            property 'neoforge.enabledGameTestNamespaces', "${modId},minecraft"
        }
        data {
            data()
            runDir '../run'
            programArgs '--mod', modId, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neo_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    modRuntimeOnly "curse.maven:cupboard-326652:8623569"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [minecraft_version      : rootProject.minecraft_version,
                             minecraft_version_range: rootProject.minecraft_version_range,
                             neo_version            : rootProject.neo_version,
                             neo_version_range      : rootProject.neo_version_range,
                             loader_version_range   : rootProject.loader_version_range,
                             mod_id                 : rootProject.mod_id,
                             mod_name               : rootProject.mod_name,
                             mod_license            : rootProject.mod_license,
                             mod_version            : rootProject.mod_version,
                             architectury_api_version: rootProject.architectury_api_version,
                             mod_authors            : rootProject.mod_authors,
                             mod_description        : rootProject.mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = 'dev'
}
